name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum is up to date
        run: go mod verify

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go tests
        run: go test -race -count=1 ./...

      - name: Frontend tests
        run: node --test web/public/dashboard.test.cjs web/admin/admin.test.cjs extension/session-sync/capture.test.cjs

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/relaypulse ./cmd/relaypulse
